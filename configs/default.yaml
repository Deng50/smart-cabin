questionnaire:
  rating_min: 1
  rating_max: 5
  lower_score_means_stronger_need: true
  unknown_values: [0, null, "不了解"]
  max_unknown_ratio: 0.20

segmentation:
  mode: manual
  manual_k: 5
  candidate_k: [2, 3, 4, 5, 6, 7, 8, 9, 10]
  random_seed: 42
  n_init: 50
  min_cluster_ratio: 0.08

need_tiers:
  strong: 0.90
  high: 0.70
  normal: 0.50

weight_fusion:
  mode: expert_only
  alpha: 0.7

entropy_weight:
  enabled: false

history_adjustment:
  enabled: false
  factors:
    normal: 1.05
    bimodal: 1.00
    high: 1.00
    low: 1.00

personalization:
  remove_low_need: false
  strong_multiplier: 1.10
  high_multiplier: 1.05
  installation_rate_threshold: 0.30

genetic_algorithm:
  population_size: 50
  generations: 100
  mutation_rate: 0.10
  random_seed: 42
  epsilon: 0.10
  lambda_l2: 0.01
  lambda_rank: 0.01

ahp:
  cr_threshold: 0.10

output:
  retention_days: 30
